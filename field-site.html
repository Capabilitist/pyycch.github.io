/* ============================== 自前SVG棒グラフ(外部チャートライブラリ不使用) ============================== */
function SimpleBarChart({ data, series, height, unit }) {
  const h = height || 220;
  const width = 600;
  const padding = { top: 10, right: 10, bottom: 28, left: 34 };
  const innerW = width - padding.left - padding.right;
  const innerH = h - padding.top - padding.bottom;
  const groupCount = data.length;
  const seriesCount = series.length;
  const maxVal = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
  const groupWidth = innerW / groupCount;
  const barGap = 6;
  const barWidth = Math.max(4, (groupWidth - barGap * (seriesCount + 1)) / seriesCount);

  return (
    <svg viewBox={`0 0 ${width} ${h}`} width="100%" height={h} preserveAspectRatio="xMidYMid meet" role="img">
      {[0, 0.5, 1].map((t, i) => {
        const y = padding.top + innerH * (1 - t);
        return <line key={i} x1={padding.left} x2={width - padding.right} y1={y} y2={y} stroke="#e7e5e4" strokeDasharray="3 3" />;
      })}
      {[0, 0.5, 1].map((t, i) => {
        const y = padding.top + innerH * (1 - t);
        const val = Math.round(maxVal * t);
        return <text key={i} x={padding.left - 6} y={y + 4} textAnchor="end" fontSize="11" fill="#78716c">{val}{unit || ''}</text>;
      })}
      {data.map((d, gi) => {
        const groupX = padding.left + gi * groupWidth;
        return (
          <g key={gi}>
            {series.map((s, si) => {
              const val = d[s.key] || 0;
              const barH = (val / maxVal) * innerH;
              const x = groupX + barGap + si * (barWidth + barGap);
              const y = padding.top + innerH - barH;
              return <rect key={s.key} x={x} y={y} width={barWidth} height={Math.max(0, barH)} fill={s.color} rx="2" />;
            })}
            <text x={groupX + groupWidth / 2} y={h - 8} textAnchor="middle" fontSize="12" fill="#78716c">{d.name}</text>
          </g>
        );
      })}
    </svg>
  );
}

const HERO_VARIANTS = { A:{label:'特集を読む', style:'filled'}, B:{label:'5分で読む', style:'outline'} };
const TRUE_RATES = { A:0.06, B:0.09 };
const EMPTY_EXPERIMENT = { A:{impressions:0,conversions:0}, B:{impressions:0,conversions:0} };

/* ============================== LOGIC ============================== */
async function loadHistory(){
  try{ const res = await window.storage.get('user:view-history', false); return res ? JSON.parse(res.value) : []; }
  catch(e){ return []; }
}
async function saveHistory(history){
  try{ await window.storage.set('user:view-history', JSON.stringify(history), false); } catch(e){}
}
async function loadExperiment(){
  try{ const res = await window.storage.get('experiment:hero-cta', true); return res ? JSON.parse(res.value) : EMPTY_EXPERIMENT; }
  catch(e){ return EMPTY_EXPERIMENT; }
}
async function saveExperiment(stats){
  try{ await window.storage.set('experiment:hero-cta', JSON.stringify(stats), true); } catch(e){}
}
function chooseVariant(stats){
  if (stats.A.impressions === 0) return 'A';
  if (stats.B.impressions === 0) return 'B';
  const rateA = stats.A.conversions / stats.A.impressions;
  const rateB = stats.B.conversions / stats.B.impressions;
  if (Math.random() < 0.1) return Math.random() < 0.5 ? 'A' : 'B';
  return rateA >= rateB ? 'A' : 'B';
}
function simulateBatch(stats, n){
  const next = { A:{...stats.A}, B:{...stats.B} };
  for (let i=0; i<n; i++){
    const v = chooseVariant(next);
    next[v] = { ...next[v], impressions: next[v].impressions + 1 };
    if (Math.random() < TRUE_RATES[v]) next[v] = { ...next[v], conversions: next[v].conversions + 1 };
  }
  return next;
}
function recordView(history, article){
  return [...history, { id:article.id, category:article.category, ts:Date.now() }].slice(-50);
}
function getRecommendations(history, articles, currentId, count){
  const viewedIds = new Set(history.map((h) => h.id));
  const categoryCounts = {};
  history.forEach((h) => { categoryCounts[h.category] = (categoryCounts[h.category] || 0) + 1; });
  const candidates = articles.filter((a) => a.id !== currentId && !viewedIds.has(a.id));
  if (history.length === 0) return candidates.slice(0, count || 3);
  return [...candidates].sort((a,b) => (categoryCounts[b.category]||0) - (categoryCounts[a.category]||0)).slice(0, count || 3);
}

function useInViewFade(){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === 'undefined') { setInView(true); return; }
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setInView(true); observer.disconnect(); }
    }, { threshold:0.1, rootMargin:'80px' });
    observer.observe(el);
    return () => observer.disconnect();
  }, []);
  return [ref, inView];
}

function InsightsView({ experiment, onSimulate, simLoading, onResetHistory, historyResetState, onResetExperiment, expResetState, historyCount }){
  const rateA = experiment.A.impressions > 0 ? experiment.A.conversions / experiment.A.impressions : 0;
  const rateB = experiment.B.impressions > 0 ? experiment.B.conversions / experiment.B.impressions : 0;
  const totalImpressions = experiment.A.impressions + experiment.B.impressions;
  const leading = totalImpressions === 0 || rateA === rateB ? null : (rateA > rateB ? 'A' : 'B');
  const allocA = totalImpressions > 0 ? Math.round((experiment.A.impressions / totalImpressions) * 100) : 50;
  const allocB = 100 - allocA;
  const chartData = [ {name:'A', rate:+(rateA*100).toFixed(1)}, {name:'B', rate:+(rateB*100).toFixed(1)} ];
  const chartSeries = [
    { key:'rate', label:'転換率', color:'#1c1917' },
  ];
  const steps = [
    { n:'01', label:'Problem', desc:'CTAのクリック率を最大化' },
    { n:'02', label:'Plan', desc:'2案を比較' },
    { n:'03', label:'Data', desc:`${totalImpressions}件を収集` },
    { n:'04', label:'Analysis', desc:'転換率を算出' },
    { n:'05', label:'Conclusion', desc: leading ? `${leading}案が優勢` : '判定待ち' },
  ];

  return (
    <div className="insights-wrap">
      <p className="eyebrow mono">サイト分析</p>
      <h1 className="insights-title">実験ダッシュボード</h1>
      <p className="insights-lede">PPDACサイクルを自動で回し、ホームのCTAボタンを継続的に改善します。</p>

      <div className="ppdac-grid">
        {steps.map((s) => (
          <div key={s.n} className="ppdac-cell">
            <p className="ppdac-n mono">{s.n}</p>
            <p className="ppdac-label">{s.label}</p>
            <p className="ppdac-desc">{s.desc}</p>
          </div>
        ))}
      </div>

      <div className="panels">
        <div className="panel">
          <p className="section-label mono">Plan · 2案</p>
          <VariantRow label="A" name="特集を読む" style="filled" stats={experiment.A} rate={rateA} allocation={allocA} leading={leading==='A'} />
          <VariantRow label="B" name="5分で読む" style="outline" stats={experiment.B} rate={rateB} allocation={allocB} leading={leading==='B'} />
          <button onClick={onSimulate} disabled={simLoading} className="sim-btn">
            <IconRefresh size={14} className={simLoading ? 'spin' : ''} />
            {simLoading ? '処理中…' : 'トラフィックをシミュレート(+50件)'}
          </button>
          <p className="hint">実際の来訪データに、疑似的な来訪をバッチで追加し、学習の収束を確認できます。</p>
        </div>
        <div className="panel">
          <p className="section-label mono">Analysis · 転換率</p>
          <SimpleBarChart data={chartData} series={chartSeries} height={200} unit="%" />
          <p className="hint">
            {totalImpressions < 20 ? 'データが少ないため、探索(ランダム表示)の比率を高めに維持しています。' : `現在の配分 — A: ${allocA}% / B: ${allocB}%(成績の良い案を自動的に優先)`}
          </p>
        </div>
      </div>

      <div className="panel" style={{marginBottom:'3rem'}}>
        <p className="section-label mono">パフォーマンス指標(目安)</p>
        <div className="metrics-grid">
          <MetricCard label="初期表示" value="瞬時" note="外部フォント・重量級ライブラリ不使用" />
          <MetricCard label="画像読込" value="遅延" note="画面内に入ってから読込" />
          <MetricCard label="レイアウトずれ" value="ほぼ0" note="画像枠を事前確保" />
          <MetricCard label="ページ遷移" value="即時" note="サーバー往復なし" />
        </div>
        <p className="hint" style={{marginTop:'1.5rem'}}>※実測のLighthouseスコアではなく、実装した最適化施策に基づく目安です。</p>
      </div>

      <div className="reset-row">
        <button onClick={onResetHistory} className="reset-link mono">
          {historyResetState === 'confirm' ? 'もう一度押すと閲覧履歴を消去します' : `閲覧履歴をリセット(${historyCount}件)`}
        </button>
        <span style={{color:'var(--stone-300)'}}>/</span>
        <button onClick={onResetExperiment} className="reset-link mono">
          {expResetState === 'confirm' ? 'もう一度押すと実験データ(共有)を消去します' : '実験データをリセット(共有)'}
        </button>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */
function App(){
  const [view, setView] = useState('home');
  const [currentArticleId, setCurrentArticleId] = useState(null);
  const [history, setHistory] = useState([]);
  const [experiment, setExperiment] = useState(EMPTY_EXPERIMENT);
  const [variant, setVariant] = useState('A');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('すべて');
  const [barState, setBarState] = useState('idle');
  const [simLoading, setSimLoading] = useState(false);
  const [historyResetState, setHistoryResetState] = useState('idle');
  const [expResetState, setExpResetState] = useState('idle');

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [h, stats] = await Promise.all([loadHistory(), loadExperiment()]);
      if (!mounted) return;
      setHistory(h);
      const v = chooseVariant(stats);
      const nextStats = { ...stats, [v]: { ...stats[v], impressions: stats[v].impressions + 1 } };
      setExperiment(nextStats);
      setVariant(v);
      saveExperiment(nextStats);
    })();
    return () => { mounted = false; };
  }, []);

  const currentArticle = useMemo(() => ARTICLES.find((a) => a.id === currentArticleId) || null, [currentArticleId]);
  const recommendations = useMemo(() => getRecommendations(history, ARTICLES, currentArticleId, 3), [history, currentArticleId]);

  const navigateTo = useCallback((nextView, articleId) => {
    setBarState('loading');
    setMobileMenuOpen(false);
    if (nextView === 'article' && articleId){
      const article = ARTICLES.find((a) => a.id === articleId);
      if (article){
        setHistory((prev) => { const next = recordView(prev, article); saveHistory(next); return next; });
      }
    }
    setView(nextView);
    setCurrentArticleId(articleId || null);
    if (typeof window !== 'undefined') window.scrollTo({ top:0, behavior:'smooth' });
    setBarState('done');
    setTimeout(() => setBarState('idle'), 300);
  }, []);

  const handleCtaClick = useCallback(() => {
    setExperiment((prev) => {
      const next = { ...prev, [variant]: { ...prev[variant], conversions: prev[variant].conversions + 1 } };
      saveExperiment(next);
      return next;
    });
    navigateTo('article', 'ai-work');
  }, [variant, navigateTo]);

  const handleSimulate = useCallback(() => {
    setSimLoading(true);
    setTimeout(() => {
      setExperiment((prev) => { const next = simulateBatch(prev, 50); saveExperiment(next); return next; });
      setSimLoading(false);
    }, 450);
  }, []);

  const handleResetHistory = useCallback(() => {
    setHistoryResetState((prevState) => {
      if (prevState !== 'confirm'){ setTimeout(() => setHistoryResetState('idle'), 3000); return 'confirm'; }
      setHistory([]); saveHistory([]); return 'idle';
    });
  }, []);

  const handleResetExperiment = useCallback(() => {
    setExpResetState((prevState) => {
      if (prevState !== 'confirm'){ setTimeout(() => setExpResetState('idle'), 3000); return 'confirm'; }
      setExperiment(EMPTY_EXPERIMENT); saveExperiment(EMPTY_EXPERIMENT); return 'idle';
    });
  }, []);

  return (
    <div>
      <TopProgressBar state={barState} />
      <Header
        onNavigateHome={() => navigateTo('home')}
        onNavigateInsights={() => navigateTo('insights')}
        onNavigateCategory={(cat) => setCategoryFilter(cat)}
        mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen}
        searchOpen={searchOpen} setSearchOpen={setSearchOpen}
        searchQuery={searchQuery} setSearchQuery={setSearchQuery}
      />
      <main>
        {view === 'home' && (
          <HomeView variant={variant} onCtaClick={handleCtaClick} onArticleClick={(id) => navigateTo('article', id)}
            recommendations={recommendations} hasHistory={history.length > 0} searchQuery={searchQuery}
            categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} />
        )}
        {view === 'article' && currentArticle && (
          <ArticleView article={currentArticle} onBack={() => navigateTo('home')} recommendations={recommendations} onArticleClick={(id) => navigateTo('article', id)} />
        )}
        {view === 'insights' && (
          <InsightsView experiment={experiment} onSimulate={handleSimulate} simLoading={simLoading}
            onResetHistory={handleResetHistory} historyResetState={historyResetState}
            onResetExperiment={handleResetExperiment} expResetState={expResetState} historyCount={history.length} />
        )}
      </main>
      <Footer onNavigateInsights={() => navigateTo('insights')} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
